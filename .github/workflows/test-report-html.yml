# Renders the feature/test-execution dashboard as one self-contained HTML page and
# uploads it as a workflow artifact, because e2e/.artifacts/ is gitignored and the
# page therefore never reaches a PR. Python stdlib only: it re-renders the committed
# run records, so it is cheap (a few seconds) and needs no database or toolchain.
name: Test report (HTML)

on:
  pull_request:
    paths:
      - ".github/workflows/test-report-html.yml"
      - "apps/development-time/SitePulse/.specify/executions/**"
      - "apps/development-time/SitePulse/.specify/features/**"
      - "apps/development-time/SitePulse/scripts/feature_traceability.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Render HTML dashboard
        run: python3 apps/development-time/SitePulse/scripts/feature_traceability.py html --out feature-report.html
      - uses: actions/upload-artifact@v6
        with:
          name: feature-report-html
          path: feature-report.html
          retention-days: 30
