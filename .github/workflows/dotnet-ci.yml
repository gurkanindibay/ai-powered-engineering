# .NET CI: runs the AuditGuard, TaskPilot and DevFactory test suites on every pull request
# and on pushes to master. SitePulse (Rust/Flutter/PostgreSQL) has its own workflow,
# sitepulse-ci.yml. Branch protection (require these checks) is a repository setting.
name: .NET CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AuditGuard
            project: apps/runtime/AuditGuard/tests/AuditGuard.Tests
          - name: TaskPilot
            project: apps/runtime/TaskPilot/tests/TaskPilot.Tests
          - name: DevFactory
            project: factory/DevFactory/tests/DevFactory.Tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.name }}-

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Build
        run: dotnet build ${{ matrix.project }} --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test ${{ matrix.project }} --no-build --configuration Release
          --logger "trx;LogFileName=${{ matrix.name }}.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/*.trx
          if-no-files-found: ignore
