name: Engineering harness
on:
  pull_request:
    paths:
      - 'scripts/pr_review_queue.py'
      - 'scripts/pr_review_watch.py'
      - 'scripts/pr_review_activity.py'
      - 'tests/pr_review_queue/**'
      - 'tests/pr_review_watch/**'
      - 'scripts/engineering_harness/**'
      - 'scripts/development_harness.py'
      - 'scripts/team_orchestrator.py'
      - 'scripts/agent_names.py'
      - 'config/agent-names.json'
      - 'scripts/issue_claim.py'
      - 'tests/issue_claim/**'
      - 'scripts/handover.py'
      - 'tests/handover/**'
      - 'scripts/harness_coordinator.py'
      - 'scripts/harness_console.py'
      - 'scripts/harness_console/**'
      - 'scripts/harness_mcp.py'
      - 'scripts/harness_stack.py'
      - 'scripts/token_guard.py'
      - 'tests/harness_coordinator/**'
      - 'tests/harness_console/**'
      - 'tests/harness_stack/**'
      - 'tests/token_guard/**'
      - 'config/engineering-harness/**'
      - 'scripts/cleanup_unused_worktrees.py'
      - 'tests/cleanup_unused_worktrees/**'
      - 'scripts/cargo_target_pool.py'
      - 'tests/cargo_target_pool/**'
      - 'scripts/review_bot.py'
      - 'tests/review_bot/**'
      - 'scripts/token_tracker.py'
      - 'scripts/token_tracker/**'
      - 'tests/token_tracker/**'
      - 'config/provider-quotas.json'
      - 'tests/engineering_harness/**'
      - '.github/workflows/engineering-harness-ci.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/pr_review_queue.py'
      - 'scripts/pr_review_watch.py'
      - 'scripts/pr_review_activity.py'
      - 'tests/pr_review_queue/**'
      - 'tests/pr_review_watch/**'
      - 'scripts/handover.py'
      - 'tests/handover/**'
      - 'scripts/harness_coordinator.py'
      - 'scripts/harness_console.py'
      - 'scripts/harness_console/**'
      - 'scripts/harness_mcp.py'
      - 'scripts/harness_stack.py'
      - 'scripts/token_guard.py'
      - 'tests/harness_coordinator/**'
      - 'tests/harness_console/**'
      - 'tests/harness_stack/**'
      - 'tests/token_guard/**'
      - 'config/engineering-harness/**'
      - 'scripts/engineering_harness/**'
      - 'scripts/development_harness.py'
      - 'scripts/team_orchestrator.py'
      - 'scripts/agent_names.py'
      - 'config/agent-names.json'
      - 'scripts/cleanup_unused_worktrees.py'
      - 'tests/cleanup_unused_worktrees/**'
      - 'scripts/cargo_target_pool.py'
      - 'tests/cargo_target_pool/**'
      - 'scripts/review_bot.py'
      - 'tests/review_bot/**'
      - 'scripts/token_tracker.py'
      - 'scripts/token_tracker/**'
      - 'tests/token_tracker/**'
      - 'config/provider-quotas.json'
      - 'tests/engineering_harness/**'
      - '.github/workflows/engineering-harness-ci.yml'
# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build deterministic protocol fixture
        run: docker build -t engineering-harness-fixture:ci tests/engineering_harness
      - name: Controller, fault injection and real Docker isolation tests
        run: |
          HARNESS_DOCKER_IMAGE=$(docker image inspect --format '{{.Id}}' engineering-harness-fixture:ci) python3 -m unittest discover -s tests/engineering_harness -v
      - name: Routing regression evaluation
        run: python3 scripts/development_harness.py --json evaluate --cases config/engineering-harness/routing-cases.json
      - name: Issue claim label tests
        run: python3 -m unittest discover -s tests/issue_claim -v
      - name: Handover protocol tests
        run: python3 -m unittest discover -s tests/handover -v
      - name: Harness coordinator and watchdog tests
        run: python3 -m unittest discover -s tests/harness_coordinator -v
      - name: Unified Control Console and MCP adapter tests
        run: python3 -m unittest discover -s tests/harness_console -v
      - name: Harness stack launcher tests
        run: python3 -m unittest discover -s tests/harness_stack -v
      - name: Token guard checkpoint gate tests
        run: python3 -m unittest discover -s tests/token_guard -v
      - name: Phase 4 failover simulation (synthetic 429, context ceiling, thrash)
        run: python3 scripts/harness_coordinator.py simulate --cases config/engineering-harness/coordinator-scenarios.json
      - name: Cargo target pool tests
        run: python3 -m unittest discover -s tests/cargo_target_pool -v
      - name: Unused worktree cleanup tests
        run: python3 -m unittest discover -s tests/cleanup_unused_worktrees -v
      - name: Review bot tests
        run: python3 -m unittest discover -s tests/review_bot -v
      - name: Review queue and watcher tests
        run: |
          python3 -m unittest discover -s tests/pr_review_queue -v
          python3 -m unittest discover -s tests/pr_review_watch -v
      - name: Token tracker tests
        run: python3 -m unittest discover -s tests/token_tracker -v
      - name: Existing SitePulse harness regression tests
        run: python3 -m unittest discover -s apps/development-time/SitePulse/harness/tests
