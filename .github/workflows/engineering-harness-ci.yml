name: Engineering harness
on:
  pull_request:
    paths:
      - 'scripts/engineering_harness/**'
      - 'scripts/development_harness.py'
      - 'scripts/team_orchestrator.py'
      - 'tests/engineering_harness/**'
      - 'config/engineering-harness/**'
      - '.github/workflows/engineering-harness-ci.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/engineering_harness/**'
      - 'scripts/development_harness.py'
      - 'scripts/team_orchestrator.py'
      - 'tests/engineering_harness/**'
      - 'config/engineering-harness/**'
      - '.github/workflows/engineering-harness-ci.yml'
# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build deterministic protocol fixture
        run: docker build -t engineering-harness-fixture:ci tests/engineering_harness
      - name: Controller, fault injection and real Docker isolation tests
        run: |
          HARNESS_DOCKER_IMAGE=$(docker image inspect --format '{{.Id}}' engineering-harness-fixture:ci) python3 -m unittest discover -s tests/engineering_harness -v
      - name: Routing regression evaluation
        run: python3 scripts/development_harness.py --json evaluate --cases config/engineering-harness/routing-cases.json
      - name: Existing SitePulse harness regression tests
        run: python3 -m unittest discover -s apps/development-time/SitePulse/harness/tests
