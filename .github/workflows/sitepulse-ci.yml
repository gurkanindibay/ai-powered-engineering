# SitePulse CI: run verification gates on pull requests, pushes to master, or manually against a real PostgreSQL service.
# Task status is changed only here (`harness_cli.py verify --record` requires CI=true).
# Branch protection for master (require this workflow) is a repository setting.
name: SitePulse CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: the jobs only read the repository (no job pushes or calls the API).
permissions:
  contents: read

defaults:
  run:
    working-directory: apps/development-time/SitePulse

# A newer push to the same PR supersedes the running check; master pushes always finish.
concurrency:
  group: sitepulse-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_USER: sitepulse_user
  DB_PASS: ci-only-password
  CARGO_TERM_COLOR: never

jobs:
  # The gates run as parallel jobs, one per group in scripts/run_tests.py (GATE_GROUPS);
  # harness/tests/test_run_tests_groups.py fails when a gate or group is missing here.
  lint:
    name: lint (Python gates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python gates (harness self-test, lints, feature traceability)
        env:
          SITEPULSE_GATE_ARTIFACT_DIR: ${{ runner.temp }}/sitepulse-suite-lint/gates
        run: python3 scripts/run_tests.py --group lint
      - name: Write lint suite manifest and run identity
        if: always()
        continue-on-error: true
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p "${{ runner.temp }}/sitepulse-suite-lint"
          python3 scripts/ci_case_results.py --json --job lint \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA" \
            --job-result "$JOB_RESULT" \
            --metadata-out "${{ runner.temp }}/sitepulse-suite-lint/producer.json" \
            --gate-manifest-out "${{ runner.temp }}/sitepulse-suite-lint/expected-gates.json" \
            > "${{ runner.temp }}/sitepulse-suite-lint/expected-suites.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: sitepulse-suite-lint-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sitepulse-suite-lint/
          if-no-files-found: warn
          retention-days: 30

  rust:
    name: rust (build, clippy, tests, schema, API system)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitepulse_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sitepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitepulse_user -d sitepulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/development-time/SitePulse/backend
          # Red runs are the common case while a PR is iterated; keep their compile output too.
          cache-on-failure: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Rust and database gates
        env:
          SITEPULSE_GATE_ARTIFACT_DIR: ${{ runner.temp }}/sitepulse-suite-rust/gates
        run: python3 scripts/run_tests.py --group rust
      - name: Write rust suite manifest and run identity
        if: always()
        continue-on-error: true
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p "${{ runner.temp }}/sitepulse-suite-rust"
          python3 scripts/ci_case_results.py --json --job rust \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA" \
            --job-result "$JOB_RESULT" \
            --metadata-out "${{ runner.temp }}/sitepulse-suite-rust/producer.json" \
            --gate-manifest-out "${{ runner.temp }}/sitepulse-suite-rust/expected-gates.json" \
            > "${{ runner.temp }}/sitepulse-suite-rust/expected-suites.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: sitepulse-suite-rust-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sitepulse-suite-rust/
          if-no-files-found: warn
          retention-days: 30

  flutter:
    name: flutter (analyze, tests, money fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/development-time/SitePulse/backend
          # Red runs are the common case while a PR is iterated; keep their compile output too.
          cache-on-failure: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: apps/development-time/SitePulse/flutter
        run: flutter pub get
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Flutter gates
        env:
          SITEPULSE_GATE_ARTIFACT_DIR: ${{ runner.temp }}/sitepulse-suite-flutter/gates
        run: python3 scripts/run_tests.py --group flutter
      - name: Write flutter suite manifest and run identity
        if: always()
        continue-on-error: true
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p "${{ runner.temp }}/sitepulse-suite-flutter"
          python3 scripts/ci_case_results.py --json --job flutter \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA" \
            --job-result "$JOB_RESULT" \
            --metadata-out "${{ runner.temp }}/sitepulse-suite-flutter/producer.json" \
            --gate-manifest-out "${{ runner.temp }}/sitepulse-suite-flutter/expected-gates.json" \
            > "${{ runner.temp }}/sitepulse-suite-flutter/expected-suites.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: sitepulse-suite-flutter-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sitepulse-suite-flutter/
          if-no-files-found: warn
          retention-days: 30

  # The browser suite runs as 8 duration-balanced shards on 8 runners at once
  # (scripts/e2e_shard.py, on the durations recorded in .specify/executions/runs).
  # Each shard has its own PostgreSQL, backend and web server; every test runs in exactly one shard.
  e2e:
    name: e2e (browser suite, shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SITEPULSE_E2E_SHARD: ${{ matrix.shard }}/8
      # test_linked_backend_suites.py only re-runs suites that other jobs already gate
      # (harness-selftest, rust-test, flutter-test, api-system), so CI shards skip it;
      # recorded local runs keep it for scenario traceability.
      # harness/tests/test_ci_linked_suites.py fails if a wrapped suite loses its CI gate.
      PYTEST_ADDOPTS: --ignore=tests/test_linked_backend_suites.py
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitepulse_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sitepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitepulse_user -d sitepulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/development-time/SitePulse/backend
          # Red runs are the common case while a PR is iterated; keep their compile output too.
          cache-on-failure: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: apps/development-time/SitePulse/flutter
        run: flutter pub get
      # The E2E web bundle; e2e/support/stack.py rebuilds it anyway when its source fingerprint differs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/development-time/SitePulse/flutter/build/web-e2e
          key: e2e-web-${{ hashFiles('apps/development-time/SitePulse/flutter/pubspec.*', 'apps/development-time/SitePulse/flutter/lib/**', 'apps/development-time/SitePulse/flutter/web/**', 'apps/development-time/SitePulse/flutter/assets/**') }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Browser end-to-end suite
        env:
          SITEPULSE_GATE_ARTIFACT_DIR: e2e/.artifacts/gates
        run: python3 scripts/run_tests.py --group e2e
      - name: Write shard collection metadata
        if: always()
        continue-on-error: true
        working-directory: apps/development-time/SitePulse
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          python3 scripts/ci_case_results.py --json \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA" \
            --job-result "$JOB_RESULT" --shard-id "${{ matrix.shard }}/8" \
            --shard-metadata-out e2e/.artifacts/collection.json > /dev/null
      # junit.xml, executions.jsonl, Playwright traces and stack logs; merged by the test-report job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: e2e-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: apps/development-time/SitePulse/e2e/.artifacts/
          # .artifacts is a dot directory: upload-artifact skips hidden paths unless told otherwise.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # One report for the whole e2e run: the stats on the run page (job summary) and the report,
  # HTML dashboard and product status snapshot as artifact `e2e-test-report`; the execution
  # history needed by record-evidence is uploaded separately as `sitepulse-actions-evidence`.
  # This replaces committing a recorded run with every task (gate test-run-recorded is off).
  test-report:
    if: always()
    needs: [lint, rust, flutter, e2e, verify]
    outputs:
      evidence_artifact: ${{ steps.evidence_metadata.outputs.artifact_name }}
      evidence_path: ${{ steps.evidence_metadata.outputs.evidence_path }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: product_status.py reads the growth of .specify (stories, scenarios) from git.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: e2e-shard-*
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: sitepulse-suite-*
          path: ${{ runner.temp }}/suite-artifacts
      - name: Merge shard results into one report
        env:
          SITEPULSE_TASK: ${{ github.event_name == 'pull_request' && format('PR {0} ({1})', github.event.pull_request.number, github.head_ref) || github.ref_name }}
          SITEPULSE_PRODUCER_STATUS: '{"lint":"${{ needs.lint.result }}","rust":"${{ needs.rust.result }}","flutter":"${{ needs.flutter.result }}","e2e":"${{ needs.e2e.result }}","verify":"${{ needs.verify.result }}"}'
        run: >-
          python3 scripts/ci_test_report.py
          --shards "${{ runner.temp }}/shards"
          --out "${{ runner.temp }}/e2e-test-report"
          --suite-artifacts "${{ runner.temp }}/suite-artifacts"
          --evidence-out "${{ runner.temp }}/sitepulse-actions-evidence"
          --run-id "${{ github.run_id }}"
          --attempt "${{ github.run_attempt }}"
          --commit "$GITHUB_SHA"
          --producer-status "$SITEPULSE_PRODUCER_STATUS"
      - id: evidence_metadata
        name: Name this attempt's evidence artifact
        run: |
          echo "artifact_name=sitepulse-actions-evidence-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "evidence_path=run-${GITHUB_RUN_ID}/attempt-${GITHUB_RUN_ATTEMPT}/runs" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-report
          path: ${{ runner.temp }}/e2e-test-report/
          retention-days: 30
      # Execution history is needed by record-evidence, but does not belong in the Pages report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.evidence_metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/sitepulse-actions-evidence/
          retention-days: 30

  # PR reports stay reviewable as the `e2e-test-report` artifact produced above. Pages migration is
  # gated until the repository Pages source and the public inventory contract are ready.
  build-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.SITEPULSE_PAGES_ACTIONS_ENABLED == 'true'
    needs: test-report
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      current: ${{ steps.head.outputs.current }}
      attempt: ${{ steps.head.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-test-report
          path: ${{ runner.temp }}/e2e-test-report
      - name: Check this run is still the current master revision
        id: head
        env:
          ACTIONS_SHA: ${{ github.sha }}
        run: |
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          git fetch origin master
          if [ "$(git rev-parse origin/master)" = "$ACTIONS_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping stale Pages artifact; master advanced after this run started.'
          fi
      - name: Restore archive state
        if: steps.head.outputs.current == 'true'
        run: |
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B pages-state "$RUNNER_TEMP/pages-state" origin/gh-pages
          else
            git worktree add --orphan -b pages-state "$RUNNER_TEMP/pages-state"
          fi
      - name: Build safe Pages site
        if: steps.head.outputs.current == 'true'
        env:
          REPORT_SITE: ${{ runner.temp }}/pages-state
          REPORT_DIR: ${{ runner.temp }}/e2e-test-report
        run: |
          python3 scripts/pages_site.py build --site "$REPORT_SITE" --report "$REPORT_DIR" \
            --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}" \
            --run-number "${{ github.run_number }}" --commit "${{ github.sha }}" \
            --action-run-id "${{ github.run_id }}" --require-public-report
      - name: Commit sanitized archive state
        if: steps.head.outputs.current == 'true'
        env:
          REPORT_SITE: ${{ runner.temp }}/pages-state
        run: |
          git -C "$REPORT_SITE" add -A
          if ! git -C "$REPORT_SITE" diff --cached --quiet; then
            git -C "$REPORT_SITE" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish SitePulse report ${{ github.run_id }}"
            git -C "$REPORT_SITE" push origin HEAD:gh-pages
          fi
      - name: Prepare and verify Pages artifact
        if: steps.head.outputs.current == 'true'
        env:
          REPORT_SITE: ${{ runner.temp }}/pages-state
          ARTIFACT_SITE: ${{ runner.temp }}/sitepulse-pages-artifact
        run: |
          mkdir -p "$ARTIFACT_SITE"
          git -C "$REPORT_SITE" archive HEAD | tar -x -C "$ARTIFACT_SITE"
          python3 scripts/pages_site.py verify-local --site "$ARTIFACT_SITE"
      - name: Upload GitHub Pages artifact
        if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sitepulse-pages-artifact

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.SITEPULSE_PAGES_ACTIONS_ENABLED == 'true' && needs['build-pages'].outputs.current == 'true'
    needs: build-pages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recheck the candidate against master before deployment
        id: head
        run: |
          git fetch origin master
          if [ "$(git rev-parse origin/master)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded Pages deployment.'
          fi
      - name: Deploy Pages artifact
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ needs['build-pages'].outputs.attempt }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify served Pages revision and links
        if: steps.head.outputs.current == 'true'
        env:
          BUILT_ATTEMPT: ${{ needs['build-pages'].outputs.attempt }}
        run: |
          python3 scripts/pages_site.py verify-remote --url "${{ steps.deployment.outputs.page_url }}" \
            --run-id "${{ github.run_id }}" --attempt "$BUILT_ATTEMPT" \
            --run-number "${{ github.run_number }}" --commit "${{ github.sha }}" \
            --action-run-id "${{ github.run_id }}"

  # Keeps the check name `verify` that branch protection requires. It runs even when a group
  # fails (a skipped required check would count as passing) and fails unless every group passed.
  verify:
    if: always()
    needs: [lint, rust, flutter, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Every gate group passed
        working-directory: .
        run: |
          echo 'lint=${{ needs.lint.result }} rust=${{ needs.rust.result }} flutter=${{ needs.flutter.result }} e2e=${{ needs.e2e.result }}'
          test '${{ needs.lint.result }}' = success
          test '${{ needs.rust.result }}' = success
          test '${{ needs.flutter.result }}' = success
          test '${{ needs.e2e.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test run recorded for the branch
        env:
          SITEPULSE_GATE_ARTIFACT_DIR: ${{ runner.temp }}/sitepulse-suite-verify/gates
        run: python3 scripts/run_tests.py --group final
      - name: Traceability (VERIFIED requirements need current evidence)
        run: python3 harness/rtm_validator.py
      - name: Write verification gate metadata
        if: always()
        continue-on-error: true
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          mkdir -p "${{ runner.temp }}/sitepulse-suite-verify"
          python3 scripts/ci_case_results.py --json --job verify \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA" \
            --job-result "$JOB_RESULT" \
            --metadata-out "${{ runner.temp }}/sitepulse-suite-verify/producer.json" \
            --gate-manifest-out "${{ runner.temp }}/sitepulse-suite-verify/expected-gates.json" \
            > "${{ runner.temp }}/sitepulse-suite-verify/expected-suites.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: sitepulse-suite-verify-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sitepulse-suite-verify/
          if-no-files-found: warn
          retention-days: 30

  record-evidence:
    if: github.event_name == 'push'
    needs: [verify, test-report]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitepulse_user
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sitepulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sitepulse_user -d sitepulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/development-time/SitePulse/backend
          cache-on-failure: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Flutter dependencies
        working-directory: apps/development-time/SitePulse/flutter
        run: flutter pub get
      # Scenario gates (scenario:SC-xx-yy-nn) accept the latest recorded execution. Use the
      # Actions-only payload for this run; nothing here is committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.test-report.outputs.evidence_artifact }}
          path: ${{ runner.temp }}/sitepulse-actions-evidence
      - name: Use this run's e2e results as the execution history
        env:
          EVIDENCE_RUNS: ${{ runner.temp }}/sitepulse-actions-evidence/${{ needs.test-report.outputs.evidence_path }}
        run: |
          test -d "$EVIDENCE_RUNS"
          rm -rf .specify/executions/runs
          cp -a "$EVIDENCE_RUNS" .specify/executions/runs
      - name: Record evidence for every task (dependency order)
        env:
          CI: "true"
          # Global gates (build, clippy, analyze, lints) are identical for every task: run once, reuse the pass.
          SITEPULSE_GATE_CACHE_DIR: ${{ runner.temp }}/gate-cache
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          dag = json.load(open(".specify/tasks/task-dag.json"))
          done, order, tasks = set(), [], {t["id"]: t for t in dag["tasks"]}
          def visit(t):
              if t in done: return
              for d in tasks[t]["depends_on"]: visit(d)
              done.add(t); order.append(t)
          for t in tasks: visit(t)
          failed = []
          for t in order:
              if subprocess.run([sys.executable, "harness/harness_cli.py", "verify", "--task", t, "--record"]).returncode != 0:
                  failed.append(t)
          print("Failed tasks:", failed or "none")
          sys.exit(1 if failed else 0)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sitepulse-evidence
          path: |
            apps/development-time/SitePulse/.specify/evidence/
            apps/development-time/SitePulse/.specify/tasks/task-dag.json
