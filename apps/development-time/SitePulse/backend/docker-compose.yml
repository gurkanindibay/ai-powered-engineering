# Local development stack. Secrets come from backend/.env (see .env.example);
# none are written here. Ports are bound to loopback only (127.0.0.1 and ::1),
# so `localhost` works for IPv4 and IPv6 clients but nothing is exposed to the network.
#
# The schema is created by the backend's migration runner (backend/migrations),
# not by docker-entrypoint-initdb.d, so there is a single schema source.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sitepulse}
      POSTGRES_USER: ${DB_USER:-sitepulse_user}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sitepulse_user} -d ${DB_NAME:-sitepulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sitepulse-net

  # Database browser for local debugging only: `docker compose --profile tools up`.
  adminer:
    image: adminer:4.8.1
    container_name: sitepulse-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
      - "[::1]:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sitepulse-net
    profiles:
      - tools

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitepulse-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sitepulse-net
    profiles:
      - full

volumes:
  postgres_data:
    driver: local

networks:
  sitepulse-net:
    driver: bridge
