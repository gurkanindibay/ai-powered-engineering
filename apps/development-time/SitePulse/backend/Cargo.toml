[package]
name = "sitepulse-backend"
version = "1.0.0"
edition = "2021"
default-run = "sitepulse-backend"
description = "SitePulse High-Performance Residential Management Platform - Rust & Axum Backend"

[features]
default = []
e2e = []

[dependencies]
axum = "0.8"
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.35", features = ["serde-str", "maths", "db-tokio-postgres"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
reqwest = { version = "0.13.5", features = ["form", "json", "rustls"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
argon2 = "0.6"
hmac = "0.13"
hex = "0.4"
chrono-tz = "0.10"
tokio-postgres-rustls = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
# Receipt PDFs (SPEC-007 R3): embedded, subset DejaVu Sans for Turkish glyphs, and the verification QR code.
printpdf = { version = "0.7.0", default-features = false, features = ["font_subsetting"] }
qrcode = { version = "0.15.0", default-features = false }
utoipa = { version = "6.0.0", features = ["chrono", "decimal", "uuid"] }

# Password hashing is deliberately expensive; keep it fast in debug/test builds.
[profile.dev.package.argon2]
opt-level = 3

[[bin]]
name = "sitepulse-backend"
path = "src/main.rs"

[[bin]]
name = "hash-password"
path = "src/bin/hash_password.rs"

[[bin]]
name = "generate-openapi"
path = "src/bin/generate_openapi.rs"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
