[package]
name = "sitepulse-backend"
version = "1.0.0"
edition = "2021"
default-run = "sitepulse-backend"
description = "SitePulse High-Performance Residential Management Platform - Rust & Axum Backend"

[dependencies]
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.35", features = ["serde-str", "maths", "db-tokio-postgres"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
reqwest = { version = "0.13.5", features = ["form", "json", "rustls"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14"
jsonwebtoken = "9"
argon2 = "0.5"
hmac = "0.12"
hex = "0.4"
chrono-tz = "0.10"
tokio-postgres-rustls = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

# Password hashing is deliberately expensive; keep it fast in debug/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[[bin]]
name = "sitepulse-backend"
path = "src/main.rs"

[[bin]]
name = "hash-password"
path = "src/bin/hash_password.rs"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
