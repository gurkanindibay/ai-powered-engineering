# SitePulse mutation scenarios — each one plants a single realistic bug and
# names the suites that should catch it. Runner: scripts/mutation_scenarios.py.
# Analysis: docs/testing/mutation-testing-analysis.md.
#
# Fields: id, layer (rust|flutter|db|python), area, operator, risk (high|medium|low),
# file (relative to apps/development-time/SitePulse), original (must occur exactly
# once in file), mutant, intent (the bug in plain words), suites (cheapest first),
# note (optional).
#
# When production code changes under a scenario, `validate` (and the harness
# self-test) fails: rewrite `original`/`mutant` against the new code, do not drop
# the scenario.

# ------------------------------------------------------------------ suites

[suites.rust-unit]
cwd = "backend"
cmd = ["cargo", "test", "--locked", "--lib"]
timeout = 900

[suites.rust-integration]
cwd = "backend"
cmd = ["cargo", "test", "--locked", "--test", "*"]
timeout = 1200

[suites.rust-db]
cwd = "backend"
cmd = ["cargo", "test", "--locked", "--test", "db_*", "--", "--ignored", "--test-threads=1"]
timeout = 1800
requires = ["postgres"]

[suites.flutter-money]
cwd = "flutter"
cmd = ["flutter", "test", "test/money_format_test.dart", "test/design_system_test.dart",
       "test/reusable_components_test.dart", "test/financial_fixture_test.dart"]
timeout = 900

[suites.flutter-all]
cwd = "flutter"
cmd = ["flutter", "test"]
timeout = 1800

[suites.flutter-payments-phase3]
cwd = "flutter"
cmd = ["flutter", "test", "test/payments_phase3_test.dart"]
timeout = 900

[suites.harness]
cwd = "."
cmd = ["python3", "-m", "unittest", "discover", "-s", "harness/tests"]
timeout = 600

