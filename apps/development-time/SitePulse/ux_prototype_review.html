<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SitePulse - UX & Requirements Design Review Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --surface-dark: #111827;
      --card-dark: #1a2234;
      --border-dark: #26334d;
      --primary: #2563eb;
      --primary-light: #60a5fa;
      --emerald: #10b981;
      --emerald-dark: #059669;
      --red: #ef4444;
      --amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top center, #172554 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 20px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Navigation Tabs */
    .persona-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      border-color: var(--primary-light);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary-light);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    /* Layout Split */
    .showcase-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .showcase-grid { grid-template-columns: 1fr; }
    }

    /* Phone Shell Mockup */
    .phone-wrapper {
      background: #000;
      border: 12px solid #1e293b;
      border-radius: 44px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      min-height: 720px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .phone-notch {
      height: 24px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 4px;
    }
    .camera-lens {
      width: 10px;
      height: 10px;
      background: #1e293b;
      border-radius: 50%;
    }

    .phone-screen {
      flex: 1;
      background: #0b1120;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Screen Elements */
    .hero-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      border-radius: var(--radius-lg);
      padding: 18px;
      color: #fff;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.3);
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .hero-title { font-size: 13px; color: #93c5fd; font-weight: 600; }
    .hero-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: #fecaca;
    }

    .hero-amount {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 4px 0 10px 0;
    }

    .kmk-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 14px;
    }
    .kmk-val { color: #fca5a5; font-weight: 700; }

    .hero-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-pay {
      background: var(--emerald);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-receipt {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    /* Offline Alert */
    .offline-box {
      background: #fef3c7;
      color: #92400e;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    /* Section Cards */
    .section-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-md);
      padding: 14px;
    }
    .section-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    /* Action Grid */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }
    .grid-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      padding: 10px 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
    }
    .grid-icon { font-size: 18px; margin-bottom: 4px; display: block; }

    /* Feed item */
    .feed-item {
      border-left: 3px solid var(--primary-light);
      padding-left: 10px;
      margin-top: 8px;
    }
    .feed-title { font-size: 12px; font-weight: 700; color: #fff; }
    .feed-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Side Panel with Specs */
    .spec-panel {
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .spec-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 13px;
    }
    .spec-table th, .spec-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-dark);
    }
    .spec-table th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.2);
    }
    .code-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--primary-light);
    }

    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 10px;
    }
    .tag-green { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .tag-blue { background: rgba(37, 99, 235, 0.2); color: #93c5fd; }

    .gherkin-box {
      background: #090e17;
      border: 1px solid #1e293b;
      border-radius: var(--radius-sm);
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 14px;
      line-height: 1.6;
    }
    .gherkin-kw { color: #f472b6; font-weight: 700; }
  </style>
</head>
<body>

<div class="container">

      </div>
    </div>

    <!-- Requirements & Architecture Side Panel -->

  </div>
</div>

function switchPersona(key, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
  } else {
    const el = document.querySelector(`.tab-btn[onclick*="'${key}'"]`);
    if (el) el.classList.add('active');
  }

  const p = personas[key];
  document.getElementById('phoneScreen').innerHTML = p.screenHtml;

  const rows = p.table.map(r => `
    <tr>
      <td><strong>${r.id}</strong></td>
      <td>${r.name}</td>
      <td><span class="code-badge">${r.artifact}</span></td>
      <td><span class="status-tag tag-blue">${r.gate}</span></td>
      <td><span class="status-tag tag-green">${r.status}</span></td>
    </tr>
  `).join('');

  document.getElementById('specPanel').innerHTML = `
    <div class="spec-title">
      <span>📋</span> ${p.title}
    </div>
    <div style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">Hedef Rol: <strong style="color:var(--text-main);">${p.role}</strong></div>

    <div class="gherkin-box">
      ${p.gherkin.replace(/(Scenario:|Given|When|Then|And)/g, '<span class="gherkin-kw">$1</span>')}
    </div>

    <table class="spec-table">
      <thead>
        <tr>
          <th>Story ID</th>
          <th>Requirement</th>
          <th>Implementation Artifact</th>
          <th>Harness Gate</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}
