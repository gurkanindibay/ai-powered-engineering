<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SitePulse - Design System, Icon Philosophy & UX Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B0F19;
      --surface-dark: #151D2F;
      --card-dark: #1B2438;
      --border-dark: #26324D;
      --accent-cyan: #00D2FF;
      --accent-green: #00E5A3;
      --accent-red: #FF4B72;
      --accent-orange: #FF9500;
      --accent-blue: #38BDF8;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 20px;
    }

    .container {
      max-width: 1360px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(0, 210, 255, 0.12);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 780px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Persona & Spec Tabs */
    .persona-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.2) 0%, rgba(37, 99, 235, 0.3) 100%);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 4px 16px rgba(0, 210, 255, 0.25);
    }

    /* Layout Split */
    .showcase-grid {
      display: grid;
      grid-template-columns: 410px 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .showcase-grid { grid-template-columns: 1fr; }
    }

    /* Phone Shell Mockup (Pixel-Equivelant to Flutter Native App) */
    .phone-wrapper {
      background: #000;
      border: 12px solid #1e293b;
      border-radius: 46px;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
      min-height: 780px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .phone-notch {
      height: 26px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 4px;
    }
    .camera-lens {
      width: 12px;
      height: 12px;
      background: #1e293b;
      border-radius: 50%;
      box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.2);
    }

    .phone-screen {
      flex: 1;
      background: var(--bg-dark);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top App Bar inside Mockup */
    .mock-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }
    .mock-title-site {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mock-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff, #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
    }

    /* Hero Balance Card (Equivalent to Flutter HeroBalanceCard) */
    .mock-hero-card {
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      border-radius: 20px;
      padding: 18px;
      border: 1.5px solid rgba(255, 75, 114, 0.4);
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.5);
    }
    .mock-hero-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .mock-site-sub {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-cyan);
    }
    .mock-unit-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .mock-pill-overdue {
      background: rgba(255, 75, 114, 0.18);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .mock-hero-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .mock-hero-amount {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      margin: 4px 0 10px 0;
    }
    .mock-kmk-breakdown {
      background: rgba(255, 75, 114, 0.12);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: var(--accent-red);
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .mock-hero-actions {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 8px;
    }
    .btn-mock-pay {
      background: var(--accent-cyan);
      color: #0F172A;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-mock-detail {
      background: transparent;
      color: #fff;
      border: 1px solid var(--border-dark);
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    /* Actions Row (Icon Set Philosophy with Tinted Containers) */
    .mock-actions-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .mock-action-box {
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .mock-icon-tint {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .mock-action-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-main);
    }
    .mock-badge-owner {
      position: absolute;
      top: -4px;
      right: 4px;
      background: var(--accent-orange);
      color: #fff;
      font-size: 7.5px;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 4px;
    }

    /* Virtual IBAN Card (Equivalent to Flutter VirtualIbanCard) */
    .mock-iban-card {
      background: linear-gradient(135deg, #0f2027, #203a43);
      border: 1px solid rgba(0, 229, 163, 0.4);
      border-radius: 18px;
      padding: 14px;
    }
    .mock-iban-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .mock-iban-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-green);
    }
    .mock-iban-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
      margin: 4px 0;
    }
    .mock-iban-note {
      font-size: 9.5px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Section Cards inside Mockup */
    .mock-section-card {
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      padding: 14px;
    }
    .mock-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Bottom Navigation Bar */
    .mock-bottom-nav {
      background: #0d1322;
      border-top: 1px solid var(--border-dark);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      border-radius: 0 0 34px 34px;
    }
    .mock-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 9.5px;
      color: var(--text-muted);
      font-weight: 600;
      gap: 3px;
      cursor: pointer;
    }
    .mock-nav-item.active {
      color: var(--accent-cyan);
    }

    /* Side Spec Panel */
    .spec-panel {
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .spec-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 12px;
    }
    .spec-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    /* Icon Philosophy Visual Showcase Box */
    .icon-philosophy-box {
      background: #090e17;
      border: 1px solid var(--border-dark);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 20px;
    }
    .philosophy-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .philosophy-card {
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .philosophy-card .icon-demo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      margin: 0 auto 8px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .philosophy-card h4 {
      font-size: 12px;
      color: #fff;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .philosophy-card p {
      font-size: 10px;
      color: var(--text-muted);
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 12.5px;
    }
    .spec-table th, .spec-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-dark);
    }
    .spec-table th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(0, 0, 0, 0.25);
    }
    .code-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-cyan);
    }

    .status-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 10px;
    }
    .tag-green { background: rgba(0, 229, 163, 0.18); color: var(--accent-green); }
    .tag-blue { background: rgba(0, 210, 255, 0.18); color: var(--accent-cyan); }

    .gherkin-box {
      background: #080c14;
      border: 1px solid #1e293b;
      border-radius: var(--radius-sm);
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #cbd5e1;
      margin-top: 14px;
      line-height: 1.6;
    }
    .gherkin-kw { color: #f472b6; font-weight: 700; }

    /* SVG Icon Helper */
    svg.icon {
      width: 20px;
      height: 20px;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge-top">Design System & Flutter Equivalency Showcase</div>
    <h1>SitePulse: Design Guidelines & Icon Philosophy</h1>
    <p>Unified design language bridging Material 3 cross-platform Flutter client, Axum/Rust high-performance services, and the Papara-inspired fintech icon set.</p>
  </header>

  <!-- Persona Switcher -->
  <div class="persona-tabs">
    <button class="tab-btn active" onclick="switchPersona('resident', this)">🏠 Site Sakini (EPIC-01)</button>
    <button class="tab-btn" onclick="switchPersona('manager', this)">🏢 Site Yöneticisi (EPIC-02)</button>
    <button class="tab-btn" onclick="switchPersona('saas', this)">☁️ SaaS Süper Yönetici (EPIC-03)</button>
    <button class="tab-btn" onclick="switchPersona('approval', this)">🔗 Davet & Kayıt Onayı (EPIC-04)</button>
    <button class="tab-btn" onclick="switchPersona('persistence', this)">🦀 Rust Backend & Schemas (EPIC-05)</button>
    <button class="tab-btn" onclick="switchPersona('auth', this)">🔐 RBAC Kimlik & Giriş (EPIC-06)</button>
  </div>

  <div class="showcase-grid">
    <!-- Mobile Phone UI Mockup (100% Equivalent to Flutter UI) -->
    <div class="phone-wrapper">
      <div class="phone-notch"><div class="camera-lens"></div></div>
      <div class="phone-screen" id="phoneScreen">
        <!-- Rendered dynamically via switchPersona() -->
      </div>
      <!-- Persistent Bottom Navigation Bar -->
      <div class="mock-bottom-nav">
        <div class="mock-nav-item active">
          <svg class="icon" stroke="#00D2FF" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Ana Sayfa</span>
        </div>
        <div class="mock-nav-item">
          <svg class="icon" stroke="#94A3B8" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          <span>Aidatlar</span>
        </div>
        <div class="mock-nav-item">
          <svg class="icon" stroke="#94A3B8" viewBox="0 0 24 24"><path d="M3 21h18M3 7v14M21 7v14M6 7V3h12v4M9 11h2M13 11h2M9 15h2M13 15h2"></path></svg>
          <span>Dairem</span>
        </div>
        <div class="mock-nav-item">
          <svg class="icon" stroke="#94A3B8" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span>Duyurular</span>
        </div>
        <div class="mock-nav-item" onclick="alert('Profil & Rol Değiştirme Sheet açıldı')">
          <svg class="icon" stroke="#94A3B8" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Profil</span>
        </div>
      </div>
    </div>

    <!-- Requirements & Architecture Side Panel -->
    <div class="spec-panel" id="specPanel">
      <!-- Rendered dynamically via switchPersona() -->
    </div>
  </div>
</div>

<script>
const personas = {
  resident: {
    title: "EPIC-01: Resident Dues Management & Financial Transparency",
    role: "Site Sakini (Kat Maliki / Ev Sahibi)",
    gherkin: `Scenario: KMK Article 20 statutory daily penalty calculation
  Given an unpaid dues liability of ₺1.400,00 with due date 15 September 2026
  When the DuesCalculationService evaluates on 25 September 2026 (10 days overdue)
  Then the delay penalty calculated is exactly ₺23,33
  And total liability displayed is ₺1.423,33 without kuruş rounding drift`,
    table: [
      { id: "STORY-01-01", name: "High-Precision Decimal Arithmetic", artifact: "DuesLiability.dart / Decimal", gate: "FinancialIntegrityGate", status: "VERIFIED" },
      { id: "STORY-01-02", name: "KMK 5% Statutory Delay Penalty", artifact: "CalculateDuesUseCase.dart", gate: "FinancialIntegrityGate", status: "VERIFIED" },
      { id: "STORY-01-03", name: "Rust Delay Compensation Engine", artifact: "dues_calculation_service.rs", gate: "CargoTestGate (17/17)", status: "VERIFIED" },
      { id: "STORY-01-04", name: "Material 3 Hero Balance Card", artifact: "hero_balance_card.dart", gate: "FlutterTestGate (16/16)", status: "VERIFIED" },
      { id: "STORY-01-05", name: "Fintech Action Row & Icon Philosophy", artifact: "resident_actions_row.dart", gate: "DesignAuditGate", status: "VERIFIED" },
      { id: "STORY-01-06", name: "Virtual IBAN & FAST Settlement", artifact: "virtual_iban_card.dart", gate: "FlutterTestGate", status: "VERIFIED" }
    ],
    screenHtml: `
      <!-- Top Bar -->
      <div class="mock-topbar">
        <div>
          <div class="mock-title-site">
            <svg class="icon" stroke="#00D2FF" style="width:16px; height:16px;" viewBox="0 0 24 24"><path d="M3 21h18M3 7v14M21 7v14M6 7V3h12v4M9 11h2M13 11h2M9 15h2M13 15h2"></path></svg>
            Begonya Sitesi
          </div>
          <div style="font-size:10px; color:#94A3B8;">A Blok Daire 14 • Kat 4</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="background:rgba(255,149,0,0.15); border:1px solid #FF9500; border-radius:12px; padding:2px 8px; font-size:9px; color:#FF9500; font-weight:700;">Çevrimdışı</div>
          <div class="mock-avatar">AY</div>
        </div>
      </div>

      <!-- Hero Balance Card -->
      <div class="mock-hero-card">
        <div class="mock-hero-header">
          <div>
            <div class="mock-site-sub">Begonya Sitesi</div>
            <div class="mock-unit-sub">A Blok D:14 • Eylül 2026</div>
          </div>
          <span class="mock-pill-overdue">10 GÜN GECİKME</span>
        </div>
        <div class="mock-hero-label">Ödenecek Toplam Tutar</div>
        <div class="mock-hero-amount">₺1.423,33</div>
        <div class="mock-kmk-breakdown">
          <svg class="icon" stroke="#FF4B72" style="width:14px; height:14px; flex-shrink:0;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span>Ana Para: ₺1.400,00 + KMK %5 Kanuni Gecikme: ₺23,33</span>
        </div>
        <div class="mock-hero-actions">
          <button class="btn-mock-pay" onclick="alert('3D Secure ile ₺1423.33 Kredi Kartı Ödeme Modalı Açıldı!')">
            <svg class="icon" stroke="#0F172A" style="width:14px; height:14px;" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            Hemen Öde
          </button>
          <button class="btn-mock-detail" onclick="alert('Aidat Hesap Detayı: 1400 * 0.05 * (10 / 30) = 23,33 TL')">Detay</button>
        </div>
      </div>

      <!-- Resident Actions Row with Curated Icon Philosophy -->
      <div class="mock-actions-row">
        <div class="mock-action-box" onclick="alert('Online Ödeme Modalı')">
          <div class="mock-icon-tint" style="background:rgba(0, 210, 255, 0.15);">
            <svg class="icon" stroke="#00D2FF" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          </div>
          <span class="mock-action-label">Aidat Öde</span>
        </div>
        <div class="mock-action-box" onclick="alert('Sanal IBAN Detay Sayfası')">
          <div class="mock-icon-tint" style="background:rgba(0, 229, 163, 0.15);">
            <svg class="icon" stroke="#00E5A3" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </div>
          <span class="mock-action-label">Sanal IBAN</span>
        </div>

          <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:6px;">
            <span style="background:rgba(0,210,255,0.15); color:#00D2FF; font-size:9px; padding:2px 6px; border-radius:4px;">UNIT_READ</span>
            <span style="background:rgba(0,210,255,0.15); color:#00D2FF; font-size:9px; padding:2px 6px; border-radius:4px;">UNIT_PAY</span>
            <span style="background:rgba(255,149,0,0.15); color:#FF9500; font-size:9px; padding:2px 6px; border-radius:4px;">INVITE_CO_RESIDENT</span>
            <span style="background:rgba(255,149,0,0.15); color:#FF9500; font-size:9px; padding:2px 6px; border-radius:4px;">MANAGE_HOUSEHOLD</span>
          </div>
        </div>
      </div>
    `
  }
};

function switchPersona(key, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
  } else {
    const el = document.querySelector(`.tab-btn[onclick*="'${key}'"]`);
    if (el) el.classList.add('active');
  }

  const p = personas[key];
  document.getElementById('phoneScreen').innerHTML = p.screenHtml;

  const rows = p.table.map(r => `
    <tr>
      <td><strong>${r.id}</strong></td>
      <td>${r.name}</td>
      <td><span class="code-badge">${r.artifact}</span></td>
      <td><span class="status-tag tag-blue">${r.gate}</span></td>
      <td><span class="status-tag tag-green">${r.status}</span></td>
    </tr>
  `).join('');

  document.getElementById('specPanel').innerHTML = `
    <div class="spec-header">
      <div>
        <div class="spec-title">${p.title}</div>
        <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">Hedef Rol: <strong style="color:var(--text-main);">${p.role}</strong></div>
      </div>
      <div style="background:rgba(0,229,163,0.15); border:1px solid #00E5A3; color:#00E5A3; font-size:11px; font-weight:700; padding:4px 10px; border-radius:8px;">
        Flutter & Rust %100 Uyumlu
      </div>
    </div>

    <!-- Icon Philosophy Visual Callout -->
    <div class="icon-philosophy-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:13px; font-weight:800; color:#fff;">SitePulse Icon Set Design Philosophy</span>
        <span style="font-size:10px; color:var(--accent-cyan); font-weight:700;">24dp Optical Grid • 2px Stroke • 15% Tinted Radius</span>
      </div>
      <div class="philosophy-grid">
        <div class="philosophy-card">
          <div class="icon-demo" style="background:rgba(0, 210, 255, 0.15);">
            <svg class="icon" stroke="#00D2FF" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          </div>
          <h4>Aidat Öde</h4>
          <p>#00D2FF Cyan</p>
        </div>
        <div class="philosophy-card">
          <div class="icon-demo" style="background:rgba(0, 229, 163, 0.15);">
            <svg class="icon" stroke="#00E5A3" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          </div>
          <h4>Sanal IBAN</h4>
          <p>#00E5A3 Mint</p>
        </div>
        <div class="philosophy-card">
          <div class="icon-demo" style="background:rgba(56, 189, 248, 0.15);">
            <svg class="icon" stroke="#38BDF8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          </div>
          <h4>Dekontlar</h4>
          <p>#38BDF8 Sky</p>
        </div>
        <div class="philosophy-card">
          <div class="icon-demo" style="background:rgba(255, 149, 0, 0.15);">
            <svg class="icon" stroke="#FF9500" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          </div>
          <h4>Sakin Davet</h4>
          <p>#FF9500 Amber</p>
        </div>
      </div>
    </div>

    <!-- Gherkin Specification -->
    <div class="gherkin-box">
      ${p.gherkin.replace(/(Scenario:|Given|When|Then|And)/g, '<span class="gherkin-kw">$1</span>')}
    </div>

    <!-- Requirements & Artifacts Traceability Table -->
    <table class="spec-table">
      <thead>
        <tr>
          <th>Story ID</th>
          <th>Requirement</th>
          <th>Implementation Artifact</th>
          <th>Verification Gate</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

// Initial render
switchPersona('resident');
</script>
</body>
</html>
