[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: P0, runs on every change
    core: P1, runs on each merge
    edge: P2, nightly
    role_homeowner: logs in as the home owner
    role_manager: logs in as the site manager
    role_saas: logs in as the SaaS admin
    role_resident: logs in as a home resident (household member)
    role_auditor: logs in as the site auditor
    journey: one user's whole journey for a role, from the first temporary-password sign-in (tests/journeys)
    J-01: Site Admin starting state F0 scenarios
    J-02: Site Admin starting state F1 scenarios
    J-03: Site Admin starting state F2 scenarios
    J-04: Site Admin starting state F3 scenarios
    J-05: Site Admin starting state navigation scenarios
    J-06: Site Admin starting state backend restart scenarios
    J-07: Site Admin single accrual history scenarios
    J-08: Site Admin multi-period history scenarios
    J-09: Site Admin closed period scenarios
    J-10: Site Admin occupancy changes scenarios
    J-11: Site Admin payment and allocation scenarios
    J-12: Site Admin financial transition corner cases
    J-13: Site Admin lifecycle chain scenarios
    J-14: Site Admin journey fixture, ledger invariant, and teardown scenarios
    J-15: Site Admin screen state scenarios
    J-16: Site Admin session recovery scenarios
    J-17: Site Admin tenant and site data isolation scenarios
    J-18: Site Admin state machine invariants
    J-19: Site Admin multi-depth chains
    depth(level): journey chain depth
    state(name): reference starting state
    layer(name): execution layer (backend, gui)
    allow_password_gate: the test expects 403 PASSWORD_CHANGE_REQUIRED (renewed password mid-session)
    gui_id(id): scenario id in docs/testing/GUI_TEST_PLAN.md (e.g. GUI-06-01)
    covers(id): scenario id in .specify/features that this non-Gherkin test verifies (e.g. SC-10-03-02)
    pending: Gherkin scenario without automation yet (deselected)
    linked: Gherkin scenario verified by a test that declares covers (deselected)
    allow_server_errors: do not fail the test on backend 5xx responses
    area_finance: financial ledger, dues, bank reconciliation, payments
    area_auth: identity, authentication, permissions, multi-tenancy
    area_residents: residents, units, directory, occupancy
    area_ui: user interface, design system, navigation
    area_db: database migrations and schema integrity
    area_core: core infrastructure and error management
xfail_strict = true

